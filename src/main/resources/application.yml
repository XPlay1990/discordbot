server:
  port: 9020
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 1024
management:
  server:
    port: 9020
  #    endpoint:
  #      shutdown:
  #        enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: always
spring:
  messages:
    encoding: utf-8
  application:
    name: discord-bot
  servlet:
    multipart:
      file-size-threshold: 2KB
      location: /tmp
      max-file-size: 550MB
      max-request-size: 600MB
      enabled: true
  boot:
    admin:
      client:
        url: localhost:8080
        username: admin
        password: password
        instance:
          metadata:
#            user:
#              name: admin
#              password: password
  #            user.timezone: ${user.timezone}
            java.version: ${java.version}
            java.vendor: ${java.vendor}
            java.vm.name: ${java.vm.name}
            java.vm.version: ${java.vm.version}
            java.vm.vendor: ${java.vm.vendor}
            os.name: ${os.name}
            os.arch: ${os.arch}
            os.version: ${os.version}
            user.language: ${user.language}
            user.country: ${user.country}
            user.timezone: ${user.timezone}
            user.name: ${user.name}
            user.home: ${user.home}
            user.dir: ${user.dir}
            java.io.tmpdir: ${java.io.tmpdir}
            java.class.path: ${java.class.path}
            java.library.path: ${java.library.path}
            java.home: ${java.home}
            file.encoding: ${file.encoding}
            file.separator: ${file.separator}
            path.separator: ${path.separator}
            line.separator: ${line.separator}
  task:
    scheduling:
      pool:
        size: 2

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:9021/eureka/

logging:
  level:
    root:
      info #debug
#    com:
#      sedmelluq:
#        discord:
#          debug
  logback:
    rollingpolicy:
      max-history: 1000000
  file:
    name: logs/Discord_Bot.log
discord:
  botToken: bottoken

resources:
  sounds:
    path: ./sounds
  images:
    path: ./images

meme:
  api: https://meme-api.com/gimme

openai:
  api:
    baseUrl: https://api.openai.com/v1
  chat:
    model: gpt-5-mini
  apikey: openaiapikey
  imageCount: 1
  badwords:
    - kacke
    - klo
    - scheiße
    - klöten

nasa:
  api: https://api.nasa.gov/planetary/apod?api_key=
  apikey: nasakey
  cron: "0 30 23 * * *"

newYear:
  cron: "0 0 0 1 1 *"
  title: "🎮 Happy New Year 2026, Legends! 🎉"
  message: |
    Auf ein Jahr voller starker neuer Releases, epischer Gaming-Momente und heißer Ankündigungen –
    und natürlich auf das gaaanz bestimmt kommende Half-Life 3 Announcement 😏
    
    Auf ein großartiges 2026 – gemeinsam im Discord! 🥂
  picture: https://images8.alphacoders.com/134/1346496.png
  footer: |
    Frohes neues Jahr euch allen!
    Jan

bot:
  channelId: 123456789
  mainChannelId: 123456789